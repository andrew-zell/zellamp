<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"
  data-za-id="bondi" data-za-name="Bondi"
  data-za-description="Translucent candy plastic, 1998 desktop-computer blue, with a backlit phone LCD and jelly buttons in orbit."
  data-za-panel="arctic-glass">
  <defs>
    <radialGradient id="plastic" cx="0.42" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#b8f2fb" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#1fb6d8" stop-opacity="0.82"/>
      <stop offset="0.85" stop-color="#007ea3" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#004d66" stop-opacity="0.95"/>
    </radialGradient>
    <pattern id="ribs" width="7" height="300" patternUnits="userSpaceOnUse">
      <rect width="3" height="300" fill="#ffffff" opacity="0.13"/>
    </pattern>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e3eef1"/>
      <stop offset="1" stop-color="#b9cdd3"/>
    </linearGradient>
    <radialGradient id="lcd" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#cfe6b0"/>
      <stop offset="1" stop-color="#9fbf80"/>
    </radialGradient>
    <radialGradient id="jelly" cx="0.42" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#b9effa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2fb3d6" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="tangerine" cx="0.42" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#fff3e0"/>
      <stop offset="0.45" stop-color="#ffb04a"/>
      <stop offset="1" stop-color="#e86a00"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#003a4d" flood-opacity="0.45"/>
    </filter>
    <clipPath id="bubbleClip"><circle cx="150" cy="150" r="140"/></clipPath>
    <clipPath id="lcdClip"><circle cx="150" cy="140" r="74"/></clipPath>
    <filter id="artTint">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.70" intercept="0.11"/>
        <feFuncG type="linear" slope="0.74" intercept="0.16"/>
        <feFuncB type="linear" slope="0.62" intercept="0.07"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <style>
    .lcd { font: 10px 'Andale Mono', Menlo, monospace; fill: #1d2a12; }
    .lcd-small { font: 8px 'Andale Mono', Menlo, monospace; fill: #3a4d26; letter-spacing: 1px; }
    .glyph { fill: #0a5f7a; }
    .za-on .dot { fill: #ff8a1a; }
    .pause-icon { display: none; }
    .za-playing .pause-icon { display: inline; }
    .za-playing .play-icon { display: none; }
  </style>

  <!-- Bubble -->
  <circle cx="150" cy="150" r="140" fill="url(#plastic)" filter="url(#shadow)"/>
  <g clip-path="url(#bubbleClip)">
    <rect width="300" height="300" fill="url(#ribs)"/>
  </g>
  <circle cx="150" cy="150" r="139" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
  <ellipse cx="128" cy="44" rx="86" ry="28" fill="url(#gloss)" opacity="0.75" clip-path="url(#bubbleClip)"/>

  <!-- Bezel + LCD -->
  <circle cx="150" cy="140" r="88" fill="url(#bezel)" stroke="#7fb8c6"/>
  <circle cx="150" cy="140" r="82" fill="none" stroke="#d6e4e8" stroke-width="5"/>
  <circle data-za="seek" data-za-shape="ring" pathLength="100" stroke-dasharray="35 100" cx="150" cy="140" r="82" fill="none" stroke="#1fb6d8"
    stroke-width="5" stroke-linecap="round" transform="rotate(-90 150 140)"><title>Seek</title></circle>
  <circle cx="150" cy="140" r="74" fill="url(#lcd)" stroke="#6f8f55"/>
  <g clip-path="url(#lcdClip)">
    <image data-za="art" x="76" y="66" width="148" height="148" preserveAspectRatio="xMidYMid slice"
      filter="url(#artTint)" opacity="0.45" style="mix-blend-mode: multiply"/>
    <g transform="translate(117 94)" fill="#1d2a12">
      <g data-za="time" data-za-font="7seg" data-za-digit="22" data-za-ghost="0.1"/>
    </g>
    <text class="lcd" x="150" y="136" text-anchor="middle" data-za="title" data-za-chars="18">Freeform Skins</text>
    <text class="lcd-small" x="150" y="149" text-anchor="middle" data-za="artist" data-za-chars="22" data-za-upper="">Zellamp</text>
    <rect data-za="vis" data-za-style="bars" data-za-bars="16" data-za-gap="2" data-za-peak="#1d2a12"
      data-za-colors="#1d2a12,#2f4220" x="100" y="156" width="100" height="30" fill="none"/>
    <text class="lcd-small" x="150" y="200" text-anchor="middle" data-za="status" data-za-upper="">Playing</text>
    <ellipse cx="140" cy="86" rx="60" ry="18" fill="#fff" opacity="0.18" pointer-events="none"/>
  </g>

  <!-- Jelly buttons in orbit -->
  <g data-za="playpause"><title>Play / Pause</title>
    <circle cx="150" cy="258" r="22" fill="url(#tangerine)" stroke="#c45a00"/>
    <ellipse cx="146" cy="248" rx="12" ry="6" fill="#fff" opacity="0.6"/>
    <path class="play-icon" d="M144 248 v20 l16 -10 z" fill="#fff" stroke="#c45a00" stroke-width="0.8"/>
    <path class="pause-icon" d="M141 249 h6 v18 h-6 z M153 249 h6 v18 h-6 z" fill="#fff" stroke="#c45a00" stroke-width="0.8"/>
  </g>
  <g data-za="prev"><title>Previous</title>
    <circle cx="86" cy="238" r="16" fill="url(#jelly)" stroke="#2a9ab8"/>
    <path class="glyph" d="M79 232 h3 v12 h-3 z M92 232 v12 l-9 -6 z"/>
  </g>
  <g data-za="next"><title>Next</title>
    <circle cx="214" cy="238" r="16" fill="url(#jelly)" stroke="#2a9ab8"/>
    <path class="glyph" d="M208 232 v12 l9 -6 z M218 232 h3 v12 h-3 z"/>
  </g>
  <g data-za="stop"><title>Stop</title>
    <circle cx="44" cy="180" r="14" fill="url(#jelly)" stroke="#2a9ab8"/>
    <rect class="glyph" x="39" y="175" width="10" height="10" rx="1.5"/>
  </g>
  <g data-za="shuffle"><title>Shuffle</title>
    <circle cx="256" cy="180" r="14" fill="url(#jelly)" stroke="#2a9ab8"/>
    <path d="M249 176 h3 l7 8 h3 M249 184 h3 l7 -8 h3" fill="none" stroke="#0a5f7a" stroke-width="1.6"/>
    <circle class="dot" cx="256" cy="190" r="2" fill="#0a5f7a"/>
  </g>
  <g data-za="vol-down"><title>Volume down</title>
    <circle cx="40" cy="112" r="13" fill="url(#jelly)" stroke="#2a9ab8"/>
    <path d="M34 112 h12" stroke="#0a5f7a" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g data-za="vol-up"><title>Volume up</title>
    <circle cx="260" cy="112" r="13" fill="url(#jelly)" stroke="#2a9ab8"/>
    <path d="M254 112 h12 M260 106 v12" stroke="#0a5f7a" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g data-za="repeat"><title>Repeat</title>
    <circle cx="66" cy="62" r="11" fill="url(#jelly)" stroke="#2a9ab8"/>
    <rect x="60" y="59" width="12" height="6" rx="3" fill="none" stroke="#0a5f7a" stroke-width="1.4"/>
    <circle class="dot" cx="66" cy="72" r="1.8" fill="#0a5f7a"/>
  </g>
  <g data-za="skins"><title>Skin Browser</title>
    <circle cx="234" cy="62" r="11" fill="url(#jelly)" stroke="#2a9ab8"/>
    <rect x="229" y="57" width="4" height="4" fill="#0a5f7a"/><rect x="235" y="57" width="4" height="4" fill="#0a5f7a"/>
    <rect x="229" y="63" width="4" height="4" fill="#0a5f7a"/><rect x="235" y="63" width="4" height="4" fill="#ff8a1a"/>
  </g>
  <g data-za="close"><title>Hide</title>
    <circle cx="258" cy="84" r="8" fill="url(#jelly)" stroke="#2a9ab8"/>
    <path d="M255 81 l6 6 M261 81 l-6 6" stroke="#0a5f7a" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
